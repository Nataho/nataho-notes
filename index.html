<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Checker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            max-width: 400px;
        }
        .spinner {
            border: 3px solid #30363d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden { display: none; }
        .error { color: #f85149; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loader">
            <div class="spinner"></div>
            <p>Checking server status...</p>
        </div>
        <div id="offline-msg" class="hidden">
            <h3 class="error">Server is offline</h3>
            <p>Please contact developer.</p>
        </div>
    </div>

    <script>
        const targetUrl = "https://hashinata.tadpole-cliff.ts.net";

        async function checkServer() {
            try {
                // Use 'no-cors' or a lightweight endpoint check. 
                // Fetching with a short timeout via AbortController.
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                await fetch(targetUrl, {
                    method: 'GET',
                    mode: 'no-cors',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                // If fetch completes (even opaque response via no-cors), the funnel is up.
                window.location.href = targetUrl;
            } catch (error) {
                // If it times out or fails to connect, the server is offline.
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('offline-msg').classList.remove('hidden');
            }
        }

        checkServer();
    </script>
</body>
</html>
